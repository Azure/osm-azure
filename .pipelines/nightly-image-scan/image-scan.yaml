# image-scan.yaml — Nightly vulnerability scanning pipeline.
#
# Triggers on:
#   - Changes to tools/helm or conformance plugin code (on push and PR)
#   - Nightly cron schedule (00:00 UTC)
#
# Scans the conformance test Docker image for known vulnerabilities using Trivy.
# Fails if MEDIUM, HIGH, or CRITICAL OS-level vulnerabilities are found.
#
trigger:
  branches:
    include:
    - main
  paths:
    include:
      - tools/helm
      - conformance/plugins/osm-arc

schedules:
  - cron: "0 0 * * *"
    always: true
    displayName: "Nightly Image Vulnerability Scan"
    branches:
      include:
        - main

pr:
  branches:
    include:
    - main
  paths:
    include:
      - tools/helm
      - conformance/plugins/osm-arc

variables:
  plugin.name: osm-arc
  plugin.path: $(System.DefaultWorkingDirectory)/conformance/plugins/$(plugin.name)
  helm.cli.path: $(System.DefaultWorkingDirectory)/tools/helm

stages: 
- stage: scan_images
  jobs:
    - template: image-scan-job.yaml
