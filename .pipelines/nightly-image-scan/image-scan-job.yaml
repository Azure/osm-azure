# image-scan-job.yaml — Build and scan the conformance test image with Trivy.
#
# Builds the conformance image with imageScan=true (tagged as test, not pushed),
# then scans it for vulnerabilities. Fails on MEDIUM+ OS vulnerabilities.
#
jobs: 
  - job: nightly_image_scan
    pool: staging-pool-amd64-mariner-2
    workspace: 
      clean: all
    steps:
    - template: ../templates/build-conf-test-image.yaml
      parameters:
        imageScan: true              # Build for scanning only (not pushed to ACR)
    - template: ../templates/install-trivy.yaml
    - template: ../templates/trivy-scan-image.yaml
      parameters:
        imageName: osm-arc-conformance
        imageTag: test
