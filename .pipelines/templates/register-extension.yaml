parameters:
  - name: serviceConnection
    type: string
    default: 'WIF - staging - upstream-ado-agent-identity'

steps:
  - bash: |
      # Install Azure CLI if not available
      if ! command -v az >/dev/null 2>&1; then
        sudo tdnf install -y azure-cli
      fi
      # Install jq if not available
      if ! command -v jq >/dev/null 2>&1; then
        sudo tdnf install -y jq
      fi
    displayName: Install Azure CLI and jq if needed
  - template: az-login-wif.yaml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
  - bash: |
      set -e
      ARC_ACCESS_TOKEN=$(az account get-access-token --verbose --resource $(ARC_RESOURCE_TOKEN) | jq -r '.accessToken')
      echo "##vso[task.setvariable variable=ARC_ACCESS_TOKEN]$ARC_ACCESS_TOKEN"
    displayName: Get Arc Access Token
    env:
      ARC_RESOURCE_TOKEN: $(ARC_RESOURCE_TOKEN)
  - bash: |
      ./scripts/register-extension.sh
    displayName: Register Arc Extension
    env:
      REGISTRY_PATH: $(REPOSITORY_NAME)
      SUBSCRIPTION: $(SUBSCRIPTION_ID)
      ACCESS_TOKEN: $(ARC_ACCESS_TOKEN)
      ARC_API_URL: $(ARC_API_URL)
      VERSION: $(IMAGE_TAG)
  - bash: |
      rm request.json
    displayName: Cleanup request json
