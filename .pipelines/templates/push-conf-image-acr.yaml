steps:
  - bash: |
      # Install Azure CLI if not available
      if ! command -v az >/dev/null 2>&1; then
        sudo tdnf install -y azure-cli
      fi
    displayName: Install Azure CLI if needed
  - bash: |
      az login --identity2>&1
      az acr login --name $(CONF_REGISTRY_NAME)2>&1
    displayName: Login to acr
    env:
      REGISTRY_NAME: $(CONF_REGISTRY_NAME)
  - bash: |
      docker push $(CONF_REPOSITORY_NAME):$(plugin.version)
    displayName: Push conformance test image to ACR
    env:
      CONF_REPOSITORY_NAME: $(CONF_REPOSITORY_NAME)
