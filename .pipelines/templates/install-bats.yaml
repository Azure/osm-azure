# install-bats.yaml — Install BATS (Bash Automated Testing System) from source.
#
# BATS runs the osm-azure test suite (test/bats/test.bats) that validates
# the extension deployment (pod counts, labels, webhooks, etc.).
#
parameters:
  batsVersion: 1.2.0

steps:
  - bash: |
      curl -L https://github.com/bats-core/bats-core/archive/v${{ parameters.batsVersion }}.tar.gz | tar xz
      pushd bats-core-${{ parameters.batsVersion }}
      sudo ./install.sh /usr/local
    displayName: Install bats and add to path
    workingDirectory: $(Pipeline.Workspace)
  - bash: bats --version
    displayName: Print bats version
