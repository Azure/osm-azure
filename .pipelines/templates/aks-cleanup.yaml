parameters:
  - name: serviceConnection
    type: string
    default: 'WIF - staging - upstream-ado-agent-identity'

steps:
  - bash: |
      # Install Azure CLI if not available
      if ! command -v az >/dev/null 2>&1; then
        sudo tdnf install -y azure-cli
      fi
    displayName: Install Azure CLI if needed
    condition: always()
  - task: AzureCLI@3
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az group delete -n ${AZURE_CLUSTER_NAME} --yes --no-wait
    displayName: Delete cluster and resource group
    condition: always()
