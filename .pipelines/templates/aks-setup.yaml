parameters:
  - name: aksAddonRun
    type: boolean
    default: false

steps:
  - script: |
      echo "##vso[task.setvariable variable=AZURE_CLUSTER_NAME]osm-helm-e2e-$(openssl rand -hex 6)"
      echo ${AZURE_CLUSTER_NAME}
    displayName: Create azure cluster name variable
  - bash: |
      # Install Azure CLI if not available
      if ! command -v az >/dev/null 2>&1; then
        echo "Azure CLI not found, installing..."
        # Install prerequisites
        if ! command -v curl >/dev/null 2>&1; then
          sudo tdnf install -y curl
        fi
        if ! command -v rpm >/dev/null 2>&1; then
          sudo tdnf install -y rpm
        fi
        # Import Microsoft signing key
        sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
        # Add Microsoft repository
        echo -e "[azure-cli]
name=Azure CLI
baseurl=https://packages.microsoft.com/yumrepos/azure-cli
enabled=1
gpgcheck=1
gpgkey=https://packages.microsoft.com/keys/microsoft.asc" | sudo tee /etc/yum.repos.d/azure-cli.repo
        # Install Azure CLI
        sudo tdnf install -y azure-cli
      else
        echo "Azure CLI is already installed"
      fi
    displayName: Install Azure CLI if needed
  - script: |
      az login --identity 2>&1

      az group create -n ${AZURE_CLUSTER_NAME} -l ${AKS_CLUSTER_LOCATION} 2>&1

      if [[ "${{ parameters.aksAddonRun }}" == "True" ]]; then
        az aks create \
            -g ${AZURE_CLUSTER_NAME} \
            -n ${AZURE_CLUSTER_NAME} \
            --enable-managed-identity \
            --no-ssh-key \
            --kubernetes-version ${K8S_VERSION} \
            2>&1
      else
        az aks create \
            -g ${AZURE_CLUSTER_NAME} \
            -n ${AZURE_CLUSTER_NAME} \
            --enable-managed-identity \
            --no-ssh-key \
            2>&1
      fi

      az aks get-credentials -n ${AZURE_CLUSTER_NAME} -g ${AZURE_CLUSTER_NAME} -f $(System.DefaultWorkingDirectory)/kubeconfig.json

      kubectl wait --for=condition=ready nodes --all --timeout=5m
    displayName: Create AKS cluster
