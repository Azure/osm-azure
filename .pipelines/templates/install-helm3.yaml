parameters:
  version: v3.1.1

steps:
  - bash: |
      # Install curl if not available
      if ! command -v curl >/dev/null 2>&1; then
        sudo tdnf install -y curl
      fi
      # Download and extract Helm using tar instead of zip
      curl -LO https://get.helm.sh/helm-${{ parameters.version }}-linux-amd64.tar.gz
      tar -zxf helm-${{ parameters.version }}-linux-amd64.tar.gz
    displayName: Install Helm
    workingDirectory: $(Pipeline.Workspace)
  - bash: |
        echo "##vso[task.setvariable variable=PATH]${PATH}:$(Pipeline.Workspace)/linux-amd64"
    displayName: Add Helm to PATH
  - bash: helm version
    displayName: Print helm version
