# conf-test-plugin-job.yaml — Pipeline to build and push the Sonobuoy conformance test plugin.
#
# Manually triggered (trigger: none). Builds the conformance test Docker image
# from conformance/plugins/osm-arc/ and pushes it to the osmazure ACR.
# The resulting image is used by Sonobuoy to run conformance tests on Arc clusters.
#
trigger: none

variables:
  plugin.name: osm-arc
  plugin.path: $(System.DefaultWorkingDirectory)/conformance/plugins/$(plugin.name)

stages: 
- stage: push_conf_test_plugin
  jobs:
    - template: push-osm-arc-conf-plugin.yaml
